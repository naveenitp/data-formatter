<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataFmt — Raw Data Formatter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">DataFmt<span class="dot">.</span></div>
    <p class="tagline">Paste raw data. Format it instantly.</p>
  </header>

  <main>
    <div class="panel" id="panel-input">
      <div class="panel-label">01 — Input</div>
      <textarea id="input" spellcheck="false" placeholder="Paste your raw data here&#10;One item per line, or space / comma separated&#10;&#10;1254251&#10;1254152&#10;2542541"></textarea>
      <div class="input-meta" id="input-meta">0 items detected</div>
    </div>

    <div class="panel" id="panel-options">
      <div class="panel-label">02 — Format options</div>

      <div class="option-group">
        <div class="option-group-title">Quote style</div>
        <div class="pills" id="quote-opts">
          <button class="pill active" data-val="single">Single &nbsp;<code>'…'</code></button>
          <button class="pill" data-val="double">Double &nbsp;<code>"…"</code></button>
          <button class="pill" data-val="backtick">Backtick &nbsp;<code>`…`</code></button>
          <button class="pill" data-val="none">None</button>
        </div>
      </div>

      <div class="option-group">
        <div class="option-group-title">Separator</div>
        <div class="pills" id="sep-opts">
          <button class="pill active" data-val=", ">Comma + space</button>
          <button class="pill" data-val=",">Comma only</button>
          <button class="pill" data-val=" | ">Pipe</button>
          <button class="pill" data-val="\n">Newline</button>
          <button class="pill" data-val="custom">Custom…</button>
        </div>
        <input type="text" id="custom-sep" class="custom-input" placeholder="Enter separator…" value=" ; " />
      </div>

      <div class="option-group">
        <div class="option-group-title">Addons</div>
        <!-- Populated dynamically from addons.config.js -->
        <div class="addon-grid" id="addon-grid"></div>
      </div>
    </div>

    <div class="panel" id="panel-output">
      <div class="panel-label">03 — Output</div>
      <div class="output-actions">
        <span class="stat" id="stat"></span>
        <div class="btns">
          <button class="btn-icon" id="btn-copy" title="Copy to clipboard">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
          <button class="btn-icon" id="btn-download" title="Download as .txt">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download
          </button>
          <button class="btn-icon btn-danger" id="btn-clear" title="Clear all">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            Clear
          </button>
        </div>
      </div>
      <textarea id="output" readonly spellcheck="false"></textarea>

      <div class="quick-templates">
        <span class="ql">Quick templates:</span>
        <button class="ql-btn" data-mode="sql">SQL IN (…)</button>
        <button class="ql-btn" data-mode="js">JS Array</button>
        <button class="ql-btn" data-mode="csv">CSV row</button>
        <button class="ql-btn" data-mode="py">Python list</button>
      </div>
    </div>

    <div class="panel" id="panel-sql">
      <div class="panel-label">04 — SQL query builder</div>

      <div class="sql-saved">
        <div class="option-group-title">Saved queries</div>
        <div class="pills" id="sql-saved-list"></div>
      </div>

      <div class="option-group" style="margin-top:14px">
        <div class="sql-query-header">
          <div class="option-group-title">Query template &nbsp;<span class="ql" style="text-transform:none;letter-spacing:0">— use <code>{{IN}}</code> where values go</span></div>
        </div>
        <textarea id="sql-template" spellcheck="false" style="min-height:110px;margin-top:6px" placeholder="SELECT *&#10;FROM your_table&#10;WHERE column_name IN ({{IN}});"></textarea>
      </div>

      <div class="option-group">
        <div class="option-group-title">Quote style for values</div>
        <div class="pills" id="sql-quote-opts">
          <button class="pill active" data-val="single">Single <code>'…'</code></button>
          <button class="pill" data-val="double">Double <code>"…"</code></button>
          <button class="pill" data-val="none">No quotes (numbers)</button>
        </div>
      </div>

      <div class="output-actions" style="margin-top:10px">
        <span class="stat" id="sql-stat"></span>
        <div class="btns">
          <button class="btn-icon" id="btn-sql-run">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Build query
          </button>
          <button class="btn-icon" id="btn-sql-copy" title="Copy query">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
        </div>
      </div>
      <textarea id="sql-output" readonly spellcheck="false" style="min-height:120px;margin-top:8px"></textarea>
    </div>
  </main>

  <footer>
    <p>DataFmt — open source · <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a></p>
  </footer>

  <div id="toast">Copied!</div>

  <!-- Configs loaded first so app.js can read ADDONS + SQL_TEMPLATES -->
  <script src="addons.config.js"></script>
  <script src="sql.config.js"></script>
  <script src="app.js"></script>
</body>
</html>
